# Local development stack.
#
#   docker compose up -d          -> infrastructure only (Kafka, Schema Registry, ES, Kibana, Connect)
#   docker compose run --rm ...   -> one-shot tools (bootstrap, producer) live behind the "tools" profile
#
# Every infra service has a healthcheck so dependents (and `make up`) wait until it is actually ready.

x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  parallelism.default: 1
  taskmanager.numberOfTaskSlots: 2
  jobmanager.memory.process.size: 1024m
  taskmanager.memory.process.size: 1280m
  execution.checkpointing.dir: file:///tmp/flink-checkpoints
  restart-strategy.type: exponential-delay
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: 9249

services:
  # Data Storage & Infra
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      # Containers use kafka:9092. Tools on your laptop use localhost:29092.
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  schema-registry:
    container_name: schema-registry
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Local dev runs without security; hide the "your data is not secure" popup.
      - SECURITY_SHOWINSECURECLUSTERWARNING=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  connect:
    container_name: kafka-connect
    image: confluentinc/cp-kafka-connect:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - ./apps/connect/config/env
    ports:
      - "8083:8083"
    volumes:
      - ./apps/connect/plugins:/etc/kafka-connect/jars
      - ./apps/connect/connectors:/connectors
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Apps (one-shot tools; run with `docker compose run --rm <name>` or the bin/ scripts)
  bootstrap:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: ./apps/bootstrap/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CONNECT_URL: http://connect:8083
      KIBANA_URL: http://kibana:5601
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./common:/app/src/common
      - ./apps/bootstrap/src:/app/src
    command: ["python", "main.py"]

  producer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: ./apps/producer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./common:/app/src/common
      - ./apps/producer/src:/app/src
    command: ["python", "main.py"]

  # Stream processing (profile "flink"; started by `make flink` after bootstrap,
  # because the job reads its Avro schemas from Schema Registry at startup)
  flink-jobmanager:
    profiles: ["flink"]
    container_name: flink-jobmanager
    build:
      context: ./apps/flink-cart-abandonment
    image: ecomm/flink-cart-abandonment:local
    # Application mode: the JobManager runs the job jar baked into the image.
    command: standalone-job --job-classname com.ecomm.insights.abandonment.CartAbandonmentJob
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8082:8081"   # Flink web UI; 8081 on the host is Schema Registry
    environment:
      FLINK_PROPERTIES: *flink-properties
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Short for local demos; a real shop would use ~15-60 min. Purchases in the
      # producer only complete carts younger than 45 s (common/events/catalog.py).
      ABANDONMENT_TIMEOUT: 2 min
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/jobs/overview | grep -q RUNNING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  flink-taskmanager:
    profiles: ["flink"]
    container_name: flink-taskmanager
    image: ecomm/flink-cart-abandonment:local
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: *flink-properties
    restart: on-failure

  # Monitoring: Prometheus scrapes the exporters and Flink; Grafana shows the dashboards.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle   # reload config with: curl -X POST localhost:9090/-/reload
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka-exporter:
    container_name: kafka-exporter
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  elasticsearch-exporter:
    container_name: elasticsearch-exporter
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
    command: ["--es.uri=http://elasticsearch:9200", "--es.indices"]
    depends_on:
      elasticsearch:
        condition: service_healthy

  grafana:
    container_name: grafana
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local dev: browse dashboards without logging in; log in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/streaming-pipeline.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  es_data:
  prometheus_data:
  grafana_data:
